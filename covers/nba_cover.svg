<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c22"/>
      <stop offset="50%" stop-color="#0a0714"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17408b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b2667" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#17408b" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#17408b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#17408b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="#06040b"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- 3D Card Envelope Outline -->
  <g filter="url(#shadow)">
    <rect x="50" y="30" width="500" height="300" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  </g>

  <!-- Envelope Fold 3D Geometry -->
  <path d="M 50 30 L 300 190 L 550 30" fill="none" stroke="#17408b" stroke-opacity="0.15" stroke-width="1.5"/>
  <path d="M 50 330 L 250 170" fill="none" stroke="#17408b" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M 550 330 L 350 170" fill="none" stroke="#17408b" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(75, 62)">
