<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c22"/>
      <stop offset="50%" stop-color="#0a0714"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b2667" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1db954" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="#06040b"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- 3D Card Envelope Outline -->
  <g filter="url(#shadow)">
    <rect x="50" y="30" width="500" height="300" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  </g>

  <!-- Envelope Fold 3D Geometry -->
  <path d="M 50 30 L 300 190 L 550 30" fill="none" stroke="#1db954" stroke-opacity="0.15" stroke-width="1.5"/>
  <path d="M 50 330 L 250 170" fill="none" stroke="#1db954" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M 550 330 L 350 170" fill="none" stroke="#1db954" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(75, 62)">
    <circle cx="8" cy="8" r="5" fill="#1db954"/>
    <text x="22" y="12" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KRYSTAL OFFICIAL SUPPLY</text>
  </g>
  <g transform="translate(420, 62)">
    <rect x="0" y="-3" width="105" height="20" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="52" y="11" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">● EN STOCK</text>
  </g>

  <!-- Central Icon & Branding -->
  <g transform="translate(300, 160)">
    <g transform="translate(-32, -55) scale(2.6)" fill="#ffffff"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></g>
    <text x="0" y="42" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">SPOTIFY PREMIUM</text>
    <text x="0" y="64" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AUTOPAY · FULL ACCESS</text>
  </g>

  <!-- Bottom Quality Seal -->
  <g transform="translate(75, 302)">
    <text x="0" y="0" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.5">LICENCIA DIGITAL · AUTODELIVERY</text>
  </g>
  <g transform="translate(435, 302)">
    <text x="0" y="0" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1">GARANTÍA 100%</text>
  </g>
</svg>